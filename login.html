<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso protegido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: "Futura Next Bold", "Montserrat", "Segoe UI", sans-serif;
      --font-body: "Open Sans", "Segoe UI", sans-serif;
      --font-ui: "Montserrat", "Segoe UI", sans-serif;
    }

    html, body {
      font-family: var(--font-body);
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: var(--font-heading);
      letter-spacing: 0.02em;
    }

    body, button, input, label, p {
      font-family: var(--font-body);
    }

    .font-ui {
      font-family: var(--font-ui);
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start px-0 relative" style="background:#007979;">
  <div class="w-full" style="background:#007979; padding: 12px 12px 10px;">
    <div class="relative w-full max-w-6xl mx-auto h-16 sm:h-20">
      <img src="https://forosostenibilidadgmp.com/wp-content/uploads/2024/10/logo-horizontal-blanco.png" alt="Logo GMP" class="absolute left-0 top-1/2 -translate-y-1/2 w-28 sm:w-44 object-contain rounded-none" />
      <img src="https://forosostenibilidadgmp.com/wp-content/uploads/2026/09/II-FORO.png" alt="II Foro" class="absolute right-0 top-1/2 -translate-y-1/2 w-36 sm:w-52 object-contain rounded-none" />
    </div>
  </div>

  <script src="env/password.js"></script>
  <script>
    if (sessionStorage.getItem('accessGranted') === 'true') {
      window.location.replace('index.html');
    }
  </script>

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mt-6 mb-6" style="margin-top: 12px;">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900 font-heading">Acceso</h1>
      <p class="text-sm text-gray-500 mt-2 font-ui">Introduce la contraseña para continuar</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2 font-ui">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#007979] focus:border-[#007979] font-ui" placeholder="********" required />
      </div>

      <button type="submit" class="w-full bg-[#007979] hover:bg-[#005f5f] text-white font-bold py-3 px-4 rounded-xl transition-colors font-ui">
        Entrar
      </button>

      <p id="errorMessage" class="hidden text-sm text-red-600 text-center font-medium"></p>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');

    const activePassword = window.APP_PASSWORD || 'gmptalks2026';
    passwordInput.value = '';

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const introducedPassword = passwordInput.value.trim();

      if (introducedPassword === activePassword) {
        sessionStorage.setItem('accessGranted', 'true');
        passwordInput.value = '';
        delete window.APP_PASSWORD;
        window.location.href = 'index.html';
      } else {
        errorMessage.textContent = 'Contraseña incorrecta.';
        errorMessage.classList.remove('hidden');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>

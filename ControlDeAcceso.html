<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador QR - Control de Acceso GMP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        #reader {
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }
        #reader video {
            object-fit: cover;
            width: 100% !important;
            height: 100% !important;
        }
        #reader__dashboard_section_csr span {
            display: none !important;
        }
        #reader button {
            background-color: #3b82f6;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body id="app-body" class="bg-gray-100 flex flex-col min-h-screen transition-colors duration-700 ease-in-out font-sans text-gray-800">

    <main class="flex-grow flex items-center justify-center p-4 relative w-full max-w-md mx-auto">
        
        <!-- VISTA 1: Escáner de QR -->
        <div id="view-scanner" class="w-full flex flex-col items-center animate-fade-in">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-gray-800">Control de Acceso GMP</h1>
                <p class="text-sm text-gray-500 mt-1">Apunta al código QR para validar la credencial</p>
            </div>

            <div class="w-full bg-white rounded-2xl shadow-xl overflow-hidden p-3 relative">
                <div id="reader" class="w-full aspect-square sm:aspect-auto sm:h-96 relative flex items-center justify-center">
                    <div class="absolute inset-0 z-10 pointer-events-none border-[3px] border-dashed border-white/40 rounded-xl m-6"></div>
                </div>
            </div>
        </div>

        <!-- VISTA 2: Cargando (Conexión con Power Automate) -->
        <div id="view-loading" class="hidden w-full flex-col items-center justify-center text-center">
            <div class="relative w-24 h-24 mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-black/10"></div>
                <div class="absolute inset-0 rounded-full border-4 border-white border-t-transparent animate-spin"></div>
            </div>
            <h2 id="loading-title" class="text-3xl font-bold text-gray-800 mb-2">Verificando...</h2>
            <p id="loading-subtitle" class="text-gray-600 font-medium">Validando asistencia en tiempo real</p>
        </div>

        <!-- VISTA 3: Resultado de la Validación -->
        <div id="view-result" class="hidden w-full flex-col items-center justify-center text-center text-white">
            
            <!-- Icono Éxito (Check) -->
            <div id="icon-success" class="hidden mb-6 bg-white/20 p-8 rounded-full backdrop-blur-sm shadow-inner">
                <svg class="w-24 h-24 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <!-- Icono Error (Cruz) -->
            <div id="icon-error" class="hidden mb-6 bg-white/20 p-8 rounded-full backdrop-blur-sm shadow-inner">
                <svg class="w-24 h-24 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>

            <!-- Textos dinámicos -->
            <h1 id="result-title" class="text-4xl font-extrabold tracking-tight mb-4 drop-shadow-md">Registrado</h1>
            <p id="result-message" class="text-lg opacity-90 mb-10 font-medium drop-shadow-sm">Acceso permitido.</p>

            <!-- Botón de reinicio -->
            <button onclick="resetScanner()" class="bg-white text-gray-900 font-bold py-4 px-10 rounded-xl shadow-2xl hover:scale-105 active:scale-95 transition-all w-full text-xl flex items-center justify-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Escanear siguiente</span>
            </button>
        </div>

    </main>

    <script>
        let html5QrCode;
        const configId = "reader";
        let isProcessing = false;
        
        // ⚠️ PEGA AQUÍ LA URL POST GENERADA POR POWER AUTOMATE
        const POWER_AUTOMATE_URL = "PEGA_AQUI_LA_URL_DE_TU_FLUJO_HTTP";

        // Elementos del DOM
        const body = document.getElementById('app-body');
        const viewScanner = document.getElementById('view-scanner');
        const viewLoading = document.getElementById('view-loading');
        const viewResult = document.getElementById('view-result');
        const loadingTitle = document.getElementById('loading-title');
        const loadingSubtitle = document.getElementById('loading-subtitle');

        window.addEventListener('load', () => {
            initScanner();
        });

        function initScanner() {
            isProcessing = false;
            
            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode(configId);
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0 
            };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                (errorMessage) => { /* Ignorar lectura continua vacía */ }
            ).catch(err => {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo iniciar la cámara. Verifica los permisos del navegador o la conexión HTTPS.");
            });
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            if (html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    validateWithPowerAutomate(decodedText);
                }).catch(() => {
                    validateWithPowerAutomate(decodedText);
                });
            }
        }

        // Petición real vía HTTP POST al flujo de Power Automate
        async function validateWithPowerAutomate(qrData) {
            showView('loading');
            body.className = 'bg-blue-500 flex flex-col min-h-screen transition-colors duration-700 ease-in-out font-sans text-gray-800';
            loadingTitle.classList.replace('text-gray-800', 'text-white');
            loadingSubtitle.classList.replace('text-gray-600', 'text-white/80');

            try {
                const response = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: qrData })
                });

                const data = await response.json();

                if (response.ok && data.registrado) {
                    showResultView(true, "Acceso Permitido", `${data.nombre || ''}: ${data.mensaje || 'Asistencia confirmada.'}`);
                } else {
                    showResultView(false, "Acceso Denegado", data.mensaje || "El código no se encuentra en el listado de asistentes.");
                }
            } catch (error) {
                console.error("Error al conectar con Power Automate:", error);
                showResultView(false, "Error de Red", "No se pudo conectar con Power Automate. Revisa la conexión a internet.");
            }
        }

        function showView(viewName) {
            viewScanner.classList.add('hidden');
            viewLoading.classList.add('hidden');
            viewResult.classList.add('hidden');

            if (viewName === 'scanner') viewScanner.classList.remove('hidden');
            if (viewName === 'loading') viewLoading.classList.remove('hidden');
            if (viewName === 'result') viewResult.classList.remove('hidden');
        }

        function showResultView(isSuccess, title, message) {
            showView('result');
            
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-message').innerText = message;

            const iconSuccess = document.getElementById('icon-success');
            const iconError = document.getElementById('icon-error');

            body.classList.remove('bg-gray-100', 'bg-blue-500', 'bg-green-500', 'bg-red-500');

            if (isSuccess) {
                body.classList.add('bg-green-500');
                iconSuccess.classList.remove('hidden');
                iconError.classList.add('hidden');
            } else {
                body.classList.add('bg-red-500');
                iconError.classList.remove('hidden');
                iconSuccess.classList.add('hidden');
            }
        }

        function resetScanner() {
            body.className = 'bg-gray-100 flex flex-col min-h-screen transition-colors duration-700 ease-in-out font-sans text-gray-800';
            loadingTitle.classList.replace('text-white', 'text-gray-800');
            loadingSubtitle.classList.replace('text-white/80', 'text-gray-600');
            
            showView('scanner');
            initScanner();
        }
    </script>
</body>
</html>

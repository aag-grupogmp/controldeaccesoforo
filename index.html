<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador QR - Power Automate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-heading: "Futura Next Bold", "Montserrat", "Segoe UI", sans-serif;
            --font-body: "Open Sans", "Segoe UI", sans-serif;
            --font-ui: "Montserrat", "Segoe UI", sans-serif;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: var(--font-heading);
            letter-spacing: 0.02em;
        }

        .font-ui, button, label, .tag, .meta-label {
            font-family: var(--font-ui);
        }

        html, body {
            overscroll-behavior: none;
        }

        #reader {
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            background: #111827; 
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        #reader video {
            object-fit: cover;
            width: 100% !important;
            height: 100% !important;
        }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
        #reader button {
            background-color: #007979;
            color: white;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        #reader button:hover {
            background-color: #005f5f;
        }

        body {
            background: #007979 !important;
            overflow: hidden;
        }

        .app-shell {
            background: #007979;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.35s ease;
        }

        .panel-surface {
            background: #ffffff;
            border-radius: 0;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            height: calc(100vh - 86px);
            overflow: hidden;
            transition: all 0.35s ease;
        }
        
        .fade-in { animation: fadeIn 0.35s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body id="app-body" class="app-shell flex flex-col min-h-screen transition-colors duration-500 ease-in-out font-sans text-gray-800 antialiased relative" style="background:#007979;">
    <div class="w-full" style="background:#007979; padding: 12px 12px 10px;">
        <div class="relative w-full max-w-6xl mx-auto h-16 sm:h-20">
            <img src="https://forosostenibilidadgmp.com/wp-content/uploads/2024/10/logo-horizontal-blanco.png" alt="Logo GMP" class="absolute left-0 top-1/2 -translate-y-1/2 w-28 sm:w-44 object-contain rounded-none" />
            <img src="https://forosostenibilidadgmp.com/wp-content/uploads/2026/09/II-FORO.png" alt="II Foro" class="absolute right-0 top-1/2 -translate-y-1/2 w-36 sm:w-52 object-contain rounded-none" />
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('accessGranted') !== 'true') {
            window.location.replace('login.html');
        }
    </script>

    <main class="panel-surface flex-grow flex items-center justify-center p-3 pt-4 sm:p-4 sm:pt-6 relative w-full mx-auto mt-0 overflow-hidden" style="border-radius: 0; min-height: calc(100vh - 86px);">
        
        <!-- ========================================== -->
        <!-- VISTA 1: ESCÁNER DE QR                     -->
        <!-- ========================================== -->
        <div id="view-scanner" class="w-full max-w-md flex flex-col items-center fade-in">
            <div class="mb-6 text-center">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight font-heading">Registro</h1>
                <p class="text-sm text-gray-500 mt-2 font-ui">Apunta al código QR del participante</p>
            </div>

            <div class="w-full bg-white rounded-none shadow-xl overflow-hidden p-3 relative">
                <div id="reader" class="w-full aspect-[3/4] sm:aspect-square relative flex items-center justify-center rounded-none">
                    <div class="absolute inset-0 z-10 pointer-events-none border-4 border-dashed border-white/50 rounded-none m-8"></div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 2: CARGANDO (PROCESANDO)             -->
        <!-- ========================================== -->
        <div id="view-loading" class="hidden w-full max-w-md flex-col items-center justify-center text-center fade-in">
            <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center w-full">
                <div class="relative w-20 h-20 mb-6">
                    <div class="absolute inset-0 rounded-full border-4 border-gray-100"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2 font-heading">Verificando...</h2>
                <p class="text-gray-500 text-sm font-ui">Consultando listado de invitados</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 3: ÉXITO (MODIFICADA SEGÚN JSON)     -->
        <!-- ========================================== -->
        <div id="view-success" class="hidden w-full max-w-md flex-col items-center justify-center fade-in">
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full">
                
                <div class="bg-emerald-50 p-6 flex flex-col items-center border-b border-emerald-100 text-center">
                    <div class="bg-emerald-500 p-4 rounded-full shadow-lg mb-4">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black text-emerald-800 tracking-tight font-heading">Acceso Permitido</h2>
                    <span class="text-emerald-600 font-semibold text-sm mt-1 bg-emerald-100 px-3 py-1 rounded-full font-ui">Verificación exitosa</span>
                </div>

                <div class="p-6 space-y-5 bg-white">
                    <!-- Fila 1: Nombre y Apellidos (Ancho completo) -->
                    <div class="border-b border-gray-100 pb-4">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 font-ui">Nombre y Apellidos</p>
                        <p id="data-nombre-apellidos" class="text-xl font-semibold text-gray-800 leading-tight font-heading">-</p>
                    </div>
                    
                    <!-- Fila 2: Empresa y Email -->
                    <div class="grid grid-cols-2 gap-4 border-b border-gray-100 pb-4">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 font-ui">Empresa</p>
                            <p id="data-empresa" class="text-md text-gray-800 font-medium break-words font-ui">-</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 font-ui">Email corporativo</p>
                            <p id="data-correo" class="text-sm text-gray-600 break-all font-medium font-ui">-</p>
                        </div>
                    </div>
                    
                    <!-- Fila 3: Edificio (Ocultable) y Mensaje -->
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Wrapper del Edificio: se oculta si no hay valor -->
                        <div id="wrapper-edificio">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 font-ui">Edificio</p>
                            <div class="inline-flex items-center px-3 py-1.5 rounded-lg bg-gray-100 text-gray-800 font-semibold text-sm mt-1 font-ui">
                                <svg class="w-4 h-4 mr-1.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                <span id="data-edificio">-</span>
                            </div>
                        </div>
                        
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 font-ui">Mensaje del sistema</p>
                            <p id="data-mensaje" class="text-sm text-emerald-600 font-medium leading-tight mt-1 font-ui">-</p>
                        </div>
                    </div>
                </div>

                <div class="p-6 pt-2 bg-white">
                    <button onclick="resetScanner()" class="w-full bg-[#007979] hover:bg-[#005f5f] active:scale-95 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        <span>Escanear de nuevo</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 4: ERROR                             -->
        <!-- ========================================== -->
        <div id="view-error" class="hidden w-full max-w-md flex-col items-center justify-center fade-in">
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full">
                
                <div class="bg-red-50 p-8 flex flex-col items-center border-b border-red-100 text-center">
                    <div class="bg-red-500 p-4 rounded-full shadow-lg mb-4">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black text-red-800 tracking-tight mb-2 font-heading">Acceso Denegado</h2>
                    <div class="bg-red-100 text-red-700 px-4 py-3 rounded-xl mt-2 w-full text-sm font-semibold font-ui">
                        <p id="error-mensaje">El usuario no se encuentra registrado.</p>
                    </div>
                </div>

                <div class="p-6 bg-white">
                    <button onclick="resetScanner()" class="w-full bg-[#007979] hover:bg-[#005f5f] active:scale-95 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        <span>Escanear de nuevo</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // =====================================================================
        // ⚙️ CONFIGURACIÓN PRINCIPAL
        // =====================================================================
        
        // 1. Pon aquí la URL real de tu flujo de Power Automate
        const POWER_AUTOMATE_URL = "";  //TODO: Ingresa la URL de tu flujo de Power Automate aquí

        // =====================================================================

        let html5QrCode;
        const configId = "reader";
        let isProcessing = false;
        
        const body = document.getElementById('app-body');
        const viewScanner = document.getElementById('view-scanner');
        const viewLoading = document.getElementById('view-loading');
        const viewSuccess = document.getElementById('view-success');
        const viewError = document.getElementById('view-error');

        window.addEventListener('load', () => {
            initScanner();
        });

        function initScanner() {
            isProcessing = false;
            
            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode(configId);
            
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                (errorMessage) => { }
            ).catch(err => {
                console.warn("No se pudo iniciar cámara trasera. Intentando cámara frontal/webcam...", err);
                
                html5QrCode.start(
                    { facingMode: "user" }, 
                    config,
                    onScanSuccess,
                    (errorMessage) => { }
                ).catch(err2 => {
                    console.error("Error iniciando ambas cámaras:", err2);
                    alert("No se pudo acceder a la cámara. Revisa los permisos de tu navegador o asegúrate de estar en una conexión HTTPS segura.");
                });
            });
        }

        function parseScannedToken(rawData) {
            if (!rawData) return { isValid: false, errorMsg: "El código QR está vacío." };
            
            let cleanText = rawData.trim().replace(/^['"]+|['"]+$/g, '');

            if (cleanText.startsWith('http://') || cleanText.startsWith('https://')) {
                try {
                    const url = new URL(cleanText);
                    const textParam = url.searchParams.get('text');
                    
                    if (textParam !== null && textParam.trim() !== "") {
                        return { isValid: true, token: textParam };
                    } else {
                        return { isValid: false, errorMsg: "QR Inválido: La URL no contiene el parámetro 'text'." };
                    }
                } catch (error) {
                    return { isValid: false, errorMsg: "QR Inválido: La URL escaneada está corrupta." };
                }
            }
            
            return { isValid: false, errorMsg: "QR Inválido: El código escaneado no es una URL permitida." };
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            showView('loading');

            if (html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    validateWithPowerAutomate(decodedText);
                }).catch(err => {
                    console.error("Error al detener el escáner", err);
                    validateWithPowerAutomate(decodedText);
                });
            }
        }

        async function validateWithPowerAutomate(qrData) {
            if (!POWER_AUTOMATE_URL || POWER_AUTOMATE_URL.trim() === "") {
                alert("CONFIGURACIÓN REQUERIDA:\nPor favor, ingresa la URL de tu flujo de Power Automate en el código fuente.");
                resetScanner();
                return;
            }

            const parsedToken = parseScannedToken(qrData);

            if (!parsedToken.isValid) {
                showErrorCard(parsedToken.errorMsg);
                showView('error');
                return;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 90000); 

            try {
                const response = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ qrData: parsedToken.token }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                let responseData = {};
                try {
                    responseData = await response.json();
                } catch (e) {
                    console.warn("La respuesta no contiene un JSON válido", e);
                }

                if (response.ok && responseData.registrado === true) {
                    populateSuccessCard(responseData);
                    showView('success');
                } else {
                    const errorMessage = responseData.mensaje || "El código no existe en el listado de inscritos o hubo un error en la validación.";
                    showErrorCard(errorMessage);
                    showView('error');
                }
            } catch (error) {
                clearTimeout(timeoutId);

                if (error.name === 'AbortError') {
                    console.error("La petición excedió el tiempo límite de 1 minuto y 30 segundos.");
                    showErrorCard("Tiempo de espera agotado (1m 30s). El servidor está tardando demasiado en responder.");
                } else {
                    console.error("Error de Red / CORS:", error);
                    showErrorCard("Error de conexión. Revisa tu internet o la configuración de Power Automate.");
                }
                showView('error'); 
            }
        }

        // =====================================================================
        // Funciones auxiliares
        // =====================================================================

        function populateSuccessCard(data) {
            // Mapeo usando las keys exactas del nuevo JSON
            document.getElementById('data-nombre-apellidos').innerText = data["nombre y apellidos"] || "-";
            document.getElementById('data-empresa').innerText = data["Empresa"] || "-";
            document.getElementById('data-correo').innerText = data["Email corporativo"] || "-";
            
            // Tratamiento de la propiedad "edificio"
            const wrapperEdificio = document.getElementById('wrapper-edificio');
            
            if (data.edificio && data.edificio.trim() !== "") {
                // Si viene con datos, aseguramos que se vea
                wrapperEdificio.style.display = 'block';
                document.getElementById('data-edificio').innerText = data.edificio;
            } else {
                // Si está vacío, ocultamos la caja completa para que no estorbe visualmente
                wrapperEdificio.style.display = 'none';
                document.getElementById('data-edificio').innerText = ""; 
            }

            // Mensaje del sistema
            document.getElementById('data-mensaje').innerText = data.mensaje || "Acceso permitido";
        }

        function showErrorCard(mensaje) {
            const errorElement = document.getElementById('error-mensaje');
            errorElement.innerText = mensaje;
        }

        function showView(viewName) {
            viewScanner.classList.add('hidden');
            viewLoading.classList.add('hidden');
            viewSuccess.classList.add('hidden');
            viewError.classList.add('hidden');

            body.classList.remove('bg-gray-100', 'bg-emerald-600', 'bg-red-600');

            if (viewName === 'scanner') {
                body.style.background = '#007979';
                viewScanner.classList.remove('hidden');
            }
            if (viewName === 'loading') {
                body.style.background = '#007979';
                viewLoading.classList.remove('hidden');
            }
            if (viewName === 'success') {
                body.style.background = '#007979';
                viewSuccess.classList.remove('hidden');
            }
            if (viewName === 'error') {
                body.style.background = '#007979';
                viewError.classList.remove('hidden');
            }
        }

        function resetScanner() {
            showView('scanner');
            initScanner();
        }
    </script>
</body>
</html>

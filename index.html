<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador QR - Power Automate</title>
    
    <!--[cite: 1] -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        /* Ajustes para el contenedor de la cámara para que parezca nativo[cite: 1] */
        #reader {
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            background: #111827; /* bg-gray-900 */
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        #reader video {
            object-fit: cover;
            width: 100% !important;
            height: 100% !important;
        }
        /* Ocultar elementos feos por defecto de la librería[cite: 1] */
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
        #reader button {
            background-color: #3b82f6;
            color: white;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        #reader button:hover {
            background-color: #2563eb;
        }
        
        /* Animaciones para transiciones de pantalla[cite: 1] */
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body id="app-body" class="bg-gray-100 flex flex-col min-h-screen transition-colors duration-500 ease-in-out font-sans text-gray-800 antialiased">

    <main class="flex-grow flex items-center justify-center p-4 relative w-full mx-auto">
        
        <!-- ========================================== -->
        <!-- VISTA 1: ESCÁNER DE QR[cite: 1]           -->
        <!-- ========================================== -->
        <div id="view-scanner" class="w-full max-w-md flex flex-col items-center fade-in">
            <div class="mb-6 text-center">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Registro</h1>
                <p class="text-sm text-gray-500 mt-2">Apunta al código QR del participante</p>
            </div>

            <div class="w-full bg-white rounded-3xl shadow-xl overflow-hidden p-3 relative">
                <div id="reader" class="w-full aspect-[3/4] sm:aspect-square relative flex items-center justify-center">
                    <div class="absolute inset-0 z-10 pointer-events-none border-4 border-dashed border-white/50 rounded-2xl m-8"></div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 2: CARGANDO (PROCESANDO)[cite: 1]   -->
        <!-- ========================================== -->
        <div id="view-loading" class="hidden w-full max-w-md flex-col items-center justify-center text-center fade-in">
            <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center w-full">
                <div class="relative w-20 h-20 mb-6">
                    <div class="absolute inset-0 rounded-full border-4 border-gray-100"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Verificando...</h2>
                <p class="text-gray-500 text-sm">Consultando listado de invitados</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 3: ÉXITO[cite: 1]                   -->
        <!-- ========================================== -->
        <div id="view-success" class="hidden w-full max-w-md flex-col items-center justify-center fade-in">
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full">
                
                <div class="bg-emerald-50 p-6 flex flex-col items-center border-b border-emerald-100 text-center">
                    <div class="bg-emerald-500 p-4 rounded-full shadow-lg mb-4">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black text-emerald-800 tracking-tight">Acceso Permitido</h2>
                    <span class="text-emerald-600 font-semibold text-sm mt-1 bg-emerald-100 px-3 py-1 rounded-full">Verificación exitosa</span>
                </div>

                <div class="p-6 space-y-5 bg-white">
                    <div class="grid grid-cols-2 gap-4 border-b border-gray-100 pb-4">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Nombre</p>
                            <p id="data-nombre" class="text-lg font-semibold text-gray-800 leading-tight">-</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Apellidos</p>
                            <p id="data-apellidos" class="text-lg font-semibold text-gray-800 leading-tight">-</p>
                        </div>
                    </div>
                    
                    <div class="border-b border-gray-100 pb-4">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Correo Electrónico</p>
                        <p id="data-correo" class="text-md text-gray-600 break-all font-medium">-</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Edificio</p>
                            <div class="inline-flex items-center px-3 py-1.5 rounded-lg bg-gray-100 text-gray-800 font-semibold text-sm mt-1">
                                <svg class="w-4 h-4 mr-1.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                <span id="data-edificio">-</span>
                            </div>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Mensaje del sistema</p>
                            <p id="data-mensaje" class="text-sm text-emerald-600 font-medium leading-tight mt-1">-</p>
                        </div>
                    </div>
                </div>

                <div class="p-6 pt-2 bg-white">
                    <button onclick="resetScanner()" class="w-full bg-gray-900 hover:bg-gray-800 active:scale-95 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        <span>Escanear de nuevo</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 4: ERROR[cite: 1]                   -->
        <!-- ========================================== -->
        <div id="view-error" class="hidden w-full max-w-md flex-col items-center justify-center fade-in">
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full">
                
                <div class="bg-red-50 p-8 flex flex-col items-center border-b border-red-100 text-center">
                    <div class="bg-red-500 p-4 rounded-full shadow-lg mb-4">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black text-red-800 tracking-tight mb-2">Acceso Denegado</h2>
                    <div class="bg-red-100 text-red-700 px-4 py-3 rounded-xl mt-2 w-full text-sm font-semibold">
                        <p id="error-mensaje">El usuario no se encuentra registrado.</p>
                    </div>
                </div>

                <div class="p-6 bg-white">
                    <button onclick="resetScanner()" class="w-full bg-gray-900 hover:bg-gray-800 active:scale-95 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        <span>Escanear de nuevo</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // =====================================================================
        // ⚙️ CONFIGURACIÓN PRINCIPAL[cite: 1]
        // =====================================================================
        
        // 1. Pon aquí la URL real de tu flujo de Power Automate
        const POWER_AUTOMATE_URL = ""; 

        // =====================================================================

        let html5QrCode;
        const configId = "reader";
        let isProcessing = false;
        
        const body = document.getElementById('app-body');
        const viewScanner = document.getElementById('view-scanner');
        const viewLoading = document.getElementById('view-loading');
        const viewSuccess = document.getElementById('view-success');
        const viewError = document.getElementById('view-error');

        window.addEventListener('load', () => {
            initScanner();
        });

        function initScanner() {
            isProcessing = false;
            
            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode(configId);
            
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                (errorMessage) => { }
            ).catch(err => {
                console.warn("No se pudo iniciar cámara trasera. Intentando cámara frontal/webcam...", err);
                
                html5QrCode.start(
                    { facingMode: "user" }, 
                    config,
                    onScanSuccess,
                    (errorMessage) => { }
                ).catch(err2 => {
                    console.error("Error iniciando ambas cámaras:", err2);
                    alert("No se pudo acceder a la cámara. Revisa los permisos de tu navegador o asegúrate de estar en una conexión HTTPS segura.");
                });
            });
        }

        // =====================================================================
        // NUEVA FUNCIÓN: Validación de formato y extracción estricta de "text"
        // =====================================================================
        function parseScannedToken(rawData) {
            if (!rawData) return { isValid: false, errorMsg: "El código QR está vacío." };
            
            let cleanText = rawData.trim().replace(/^['"]+|['"]+$/g, '');

            if (cleanText.startsWith('http://') || cleanText.startsWith('https://')) {
                try {
                    const url = new URL(cleanText);
                    const textParam = url.searchParams.get('text');
                    
                    // Si existe el parámetro text y no está vacío, es válido
                    if (textParam !== null && textParam.trim() !== "") {
                        return { isValid: true, token: textParam };
                    } else {
                        // Si no tiene parámetro text, es ERROR
                        return { isValid: false, errorMsg: "QR Inválido: La URL no contiene el parámetro 'text'." };
                    }
                } catch (error) {
                    return { isValid: false, errorMsg: "QR Inválido: La URL escaneada está corrupta." };
                }
            }
            
            // Si no es URL, consideramos que no tiene "text", por tanto es ERROR
            return { isValid: false, errorMsg: "QR Inválido: El código escaneado no es una URL permitida." };
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            showView('loading');

            if (html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    // Llamamos a la nueva función
                    validateWithPowerAutomate(decodedText);
                }).catch(err => {
                    console.error("Error al detener el escáner", err);
                    validateWithPowerAutomate(decodedText);
                });
            }
        }

        // =====================================================================
        // NUEVA FUNCIÓN: Envío a servidor con límite de 1m 30s
        // =====================================================================
        async function validateWithPowerAutomate(qrData) {
            if (!POWER_AUTOMATE_URL || POWER_AUTOMATE_URL.trim() === "") {
                alert("CONFIGURACIÓN REQUERIDA:\nPor favor, ingresa la URL de tu flujo de Power Automate en el código fuente.");
                resetScanner();
                return;
            }

            // 1. Verificar estrictamente el código antes de enviarlo
            const parsedToken = parseScannedToken(qrData);

            if (!parsedToken.isValid) {
                // Falla inmediatamente si no tiene el parámetro text
                showErrorCard(parsedToken.errorMsg);
                showView('error');
                return;
            }

            // 2. Si es válido (tiene el parámetro 'text'), definimos tiempo límite de 1 minuto 30 segundos (90000ms)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 90000); 

            try {
                const response = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ qrData: parsedToken.token }), // Enviamos solo el token extraído
                    signal: controller.signal
                });

                // Limpiar timeout porque ha respondido a tiempo
                clearTimeout(timeoutId);

                let responseData = {};
                try {
                    responseData = await response.json();
                } catch (e) {
                    console.warn("La respuesta no contiene un JSON válido", e);
                }

                if (response.ok && responseData.registrado === true) {
                    populateSuccessCard(responseData);
                    showView('success');
                } else {
                    const errorMessage = responseData.mensaje || "El código no existe en el listado de inscritos o hubo un error en la validación.";
                    showErrorCard(errorMessage);
                    showView('error');
                }
            } catch (error) {
                clearTimeout(timeoutId);

                // Evaluar si es error de timeout
                if (error.name === 'AbortError') {
                    console.error("La petición excedió el tiempo límite de 1 minuto y 30 segundos.");
                    showErrorCard("Tiempo de espera agotado (1m 30s). El servidor está tardando demasiado en responder.");
                } else {
                    console.error("Error de Red / CORS:", error);
                    showErrorCard("Error de conexión. Revisa tu internet o la configuración de Power Automate.");
                }
                showView('error'); 
            }
        }

        // =====================================================================
        // Funciones auxiliares[cite: 1]
        // =====================================================================

        function populateSuccessCard(data) {
            document.getElementById('data-nombre').innerText = data.nombre || "-";
            document.getElementById('data-apellidos').innerText = data.apellidos || "-";
            document.getElementById('data-correo').innerText = data.correo || "-";
            document.getElementById('data-edificio').innerText = data.edificio || "-";
            document.getElementById('data-mensaje').innerText = data.mensaje || "Acceso permitido";
        }

        function showErrorCard(mensaje) {
            const errorElement = document.getElementById('error-mensaje');
            errorElement.innerText = mensaje;
        }

        function showView(viewName) {
            viewScanner.classList.add('hidden');
            viewLoading.classList.add('hidden');
            viewSuccess.classList.add('hidden');
            viewError.classList.add('hidden');

            body.classList.remove('bg-gray-100', 'bg-emerald-600', 'bg-red-600');

            if (viewName === 'scanner') {
                body.classList.add('bg-gray-100');
                viewScanner.classList.remove('hidden');
            }
            if (viewName === 'loading') {
                body.classList.add('bg-gray-100');
                viewLoading.classList.remove('hidden');
            }
            if (viewName === 'success') {
                body.classList.add('bg-emerald-600'); 
                viewSuccess.classList.remove('hidden');
            }
            if (viewName === 'error') {
                body.classList.add('bg-red-600'); 
                viewError.classList.remove('hidden');
            }
        }

        function resetScanner() {
            showView('scanner');
            initScanner();
        }
    </script>
</body>
</html>
